name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: "Run the full browser suite even when the change only updates documentation or the share image"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full browser suite exceeded the former 60-minute job limit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run licenses:check
      - run: npm test
      - run: npm run puzzles:test
      - run: npm run build
      - name: Build and statically verify GitHub Pages artifact
        env:
          PAGES_REQUESTED_SHA: ${{ github.sha }}
        run: |
          PAGES_BUILD=1 npm run build
          npm run pages:artifact:check
      - run: npm run performance:r5
      - name: Decide whether browser tests are needed
        id: browser-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_BROWSER_TESTS: ${{ inputs.run_browser_tests }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_BROWSER_TESTS" = "true" ]; then
              echo "required=true" >> "$GITHUB_OUTPUT"
              echo "Running the browser suite because it was requested manually."
            else
              echo "required=false" >> "$GITHUB_OUTPUT"
              echo "Skipping the browser suite for this manual run."
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Unknown event type; running the browser suite as a precaution."
            exit 0
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Could not verify the change range; running the browser suite as a precaution."
            exit 0
          fi

          if ! changed_paths="$(git diff --name-only "$base" "$HEAD_SHA")"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Could not list changed files; running the browser suite as a precaution."
            exit 0
          fi

          run_browser=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              *.md|docs/*|.github/workflows/*|public/share-card.png)
                ;;
              *)
                run_browser=true
                ;;
            esac
          done <<< "$changed_paths"

          echo "required=$run_browser" >> "$GITHUB_OUTPUT"
          if [ "$run_browser" = "true" ]; then
            echo "Running browser tests for product, data, test, asset, or configuration changes."
          else
            echo "Skipping browser tests for documentation, workflow, and share-image-only changes."
          fi
      - name: Install Playwright browsers
        if: steps.browser-scope.outputs.required == 'true'
        run: npm run test:e2e:install
      - name: Check browser transitions, recovery and compact layout
        if: steps.browser-scope.outputs.required == 'true'
        run: npx playwright test --grep 'V02 keeps the primary controls|Q02/U04|fatal recovery'
      - name: Run browser tests
        if: steps.browser-scope.outputs.required == 'true'
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always() && steps.browser-scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser images and results
        if: always() && steps.browser-scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/*.json
          if-no-files-found: warn
          retention-days: 14
