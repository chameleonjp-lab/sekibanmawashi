name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The first R5 run took 22.5 minutes despite failing the long flows early.
    # Allow the full 20-run and ten-viewport acceptance in both engines.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run licenses:check
      - run: npm test
      - run: npm run puzzles:test
      - run: npm run build
      - run: npm run performance:r5
      - name: Install Playwright browsers
        run: npm run test:e2e:install
      - name: Check browser transitions and compact layout
        run: npx playwright test --grep 'V02 keeps the primary controls|Q02/U04'
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser images and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/results.json
          if-no-files-found: warn
          retention-days: 14
