name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run licenses:check
      - run: npm test
      - run: npm run puzzles:test
      - run: npm run build
      - name: Build and statically verify GitHub Pages artifact
        env:
          PAGES_REQUESTED_SHA: ${{ github.sha }}
        run: |
          PAGES_BUILD=1 npm run build
          npm run pages:artifact:check
      - run: npm run performance:r5

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps "${{ matrix.project }}"
      - name: Run browser tests for ${{ matrix.project }}
        run: npx playwright test --project "${{ matrix.project }}"
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser images and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.project }}-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/*.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    # Keep the exact "verify" check required by the Pages publication gate.
    # It succeeds only when both browser projects and the static checks pass.
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Static checks: $CHECKS_RESULT; browser projects: $BROWSER_RESULT"
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
